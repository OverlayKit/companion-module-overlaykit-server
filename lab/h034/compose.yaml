name: overlaykit-h034

services:
  overlaykit:
    build:
      context: ../..
      dockerfile: lab/h034/Dockerfile.overlaykit
    environment:
      COOKIE_SECURE: never
      CORS_ORIGIN: http://h034-maintainer.local
      DATA_DIR: /data
      H034_HOST_GID: '${H034_HOST_GID:?H034_HOST_GID is required}'
      H034_HOST_UID: '${H034_HOST_UID:?H034_HOST_UID is required}'
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      REST_PORT: '3000'
      WS_HOST: 0.0.0.0
      WS_PORT: '8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      h034_lan:
        ipv4_address: 172.31.34.10
    ports:
      - '127.0.0.1:${H034_REST_PORT:-33034}:3000'
      - '127.0.0.1:${H034_PROXY_CONTROL_PORT:-39034}:9090'
    volumes:
      - overlaykit_data:/data
      - '${H034_EVIDENCE_DIR:?H034_EVIDENCE_DIR is required}:/evidence'

  companion:
    build:
      context: ../..
      dockerfile: lab/h034/Dockerfile.companion
    depends_on:
      overlaykit:
        condition: service_healthy
    environment:
      H034_HOST_GID: '${H034_HOST_GID:?H034_HOST_GID is required}'
      H034_HOST_UID: '${H034_HOST_UID:?H034_HOST_UID is required}'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/']
      interval: 2s
      timeout: 2s
      retries: 45
    networks:
      h034_lan:
        ipv4_address: 172.31.34.20
    ports:
      - '127.0.0.1:${H034_COMPANION_PORT:-38034}:8000'
      - '127.0.0.1:${H034_SATELLITE_PORT:-36622}:16622'
    volumes:
      - companion_data:/companion
      - '${H034_EVIDENCE_DIR:?H034_EVIDENCE_DIR is required}:/evidence'

networks:
  h034_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.34.0/24

volumes:
  companion_data:
  overlaykit_data:
